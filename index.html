document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

#F17A7A;\n  --blue-400:  #6FAFF2;\n\n  /* ---- Semantic: surfaces ---- */\n  --surface-page: var(--ink-0);\n  --surface-raised: var(--ink-1);\n  --surface-card: var(--ink-2);\n  --surface-elevated: var(--ink-3);\n  --surface-accent: var(--mint-500);\n\n  /* ---- Semantic: text ---- */\n  --text-heading: var(--light-0);\n  --text-body: var(--light-1);\n  --text-muted: var(--light-2);\n  --text-disabled: var(--light-3);\n  --text-on-accent: var(--mint-ink);\n  --text-accent: var(--mint-400);\n  --text-link: var(--mint-400);\n  --text-link-hover: var(--mint-300);\n\n  /* ---- Semantic: borders ---- */\n  --border-subtle: var(--line-1);\n  --border-default: var(--line-2);\n  --border-strong: var(--line-3);\n  --border-accent: var(--mint-500);\n\n  /* ---- Semantic: status ---- */\n  --status-success: var(--mint-400);\n  --status-warning: var(--amber-400);\n  --status-danger: var(--red-400);\n  --status-info: var(--blue-400);\n  --status-success-bg: rgba(82, 223, 172, 0.12);\n  --status-warning-bg: rgba(232, 180, 79, 0.12);\n  --status-danger-bg: rgba(241, 122, 122, 0.12);\n  --status-info-bg: rgba(111, 175, 242, 0.12);\n}\n<\u002Fstyle>\n  <style>/* WHAB typography system */\n:root {\n  /* Families */\n  --font-display: 'Julius Sans One', 'Outfit', sans-serif; /* brand moments, letterspaced caps */\n  --font-sans: 'Outfit', system-ui, sans-serif;            /* everything else */\n  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;   /* data, numerals, code */\n\n  /* Sizes (px) */\n  --text-xs: 12px;\n  --text-sm: 13px;\n  --text-base: 15px;\n  --text-md: 17px;\n  --text-lg: 20px;\n  --text-xl: 24px;\n  --text-2xl: 32px;\n  --text-3xl: 44px;\n  --text-4xl: 60px;\n\n  /* Weights */\n  --weight-light: 300;\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* Line heights */\n  --leading-tight: 1.1;\n  --leading-snug: 1.3;\n  --leading-normal: 1.55;\n\n  /* Tracking */\n  --tracking-brand: 0.32em;  /* wordmark-st t-disabled: var(--light-3);\n  --text-on-accent: var(--mint-ink);\n  --text-accent: var(--mint-400);\n  --text-link: var(--mint-400);\n  --text-link-hover: var(--mint-300);\n\n  /* ---- Semantic: borders ---- */\n  --border-subtle: var(--line-1);\n  --border-default: var(--line-2);\n  --border-strong: var(--line-3);\n  --border-accent: var(--mint-500);\n\n  /* ---- Semantic: status ---- */\n  --status-success: var(--mint-400);\n  --status-warning: var(--amber-400);\n  --status-danger: var(--red-400);\n  --status-info: var(--blue-400);\n  --status-success-bg: rgba(82, 223, 172, 0.12);\n  --status-warning-bg: rgba(232, 180, 79, 0.12);\n  --status-danger-bg: rgba(241, 122, 122, 0.12);\n  --status-info-bg: rgba(111, 175, 242, 0.12);\n}\n\n/* WHAB typography system */\n:root {\n  /* Families */\n  --font-display: 'Julius Sans One', 'Outfit', sans-serif; /* brand moments, letterspaced caps */\n  --font-sans: 'Outfit', system-ui, sans-serif;            /* everything else */\n  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;   /* data, numerals, code */\n\n  /* Sizes (px) */\n  --text-xs: 12px;\n  --text-sm: 13px;\n  --text-base: 15px;\n  --text-md: 17px;\n  --text-lg: 20px;\n  --text-xl: 24px;\n  --text-2xl: 32px;\n  --text-3xl: 44px;\n  --text-4xl: 60px;\n\n  /* Weights */\n  --weight-light: 300;\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* Line heights */\n  --leading-tight: 1.1;\n  --leading-snug: 1.3;\n  --leading-normal: 1.55;\n\n  /* Tracking */\n  --tracking-brand: 0.32em;  /* wordmark-style caps */\n  --tracking-caps: 0.14em;   /* labels, eyebrows */\n  --tracking-normal: 0;\n}\n\n/* WHAB spacing + radius scales */\n:root {\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n\n  /* Radii — geometric brand, kept modest */\n  --radius-sm: 4px;   /* badges, tags, inputs' inner bits */\n  --radius-md: 8px;   /* buttons, inputs */\n  --radius-lg: 12px;  /* cards, dialogs */\n  --radius-full: 999px;\n\n  /* Control heights */\n  --control-sm: 32px;\n  --control-md: 40px;\n  --control-lg: 48px;\n}\n\n/* WHAB elevation, focus, motion */\n:root {\n  /* Elevation — soft, deep shadows; borders do most of the separation on dark */\n  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);\n  --shadow-2: 0 4px 12px rgba(0, 0, 0, 0.35);\n  --shadow-3: 0 12px 32px rgba(0, 0, 0, 0.45);\n  --shadow-glow: 0 0 0 4px rgba(82, 223, 172, 0.18); /* accent halo */\n\n  /* Focus ring */\n  --focus-ring: 0 0 0 2px var(--ink-0), 0 0 0 4px var(--mint-500);\n\n  /* Motion */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-normal: 200ms; /* @kind other */\n}\n\n/* WHAB base element defaults */\nbody {\n  margin: 0;\n  background: var(--surface-page);\n  color: var(--text-body);\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n}\nh1, h2, h3, h4 { color: var(--text-heading); margin: 0; }\na { color: var(--text-link); text-decoration: none; transition: color var(--duration-fast) var(--ease-out); }\na:hover { color: var(--text-link-hover); }\n::selection { background: rgba(82, 223, 172, 0.3); }\n\n<\u002Fstyle>\n  <script src=\"2d0a5834-f795-4260-ab1f-80e44bb9e95e\"><\u002Fscript>\n  <style>\n    body{margin:0;background:var(--surface-page);}\n    html{scroll-behavior:smooth;}\n    a{color:var(--mint-400);text-decoration:none;}\n    a:hover{color:var(--mint-300);}\n    ::selection{background:var(--mint-500);color:var(--mint-ink);}\n    @media print{\n      @page{margin:14mm;}\n      :root{\n        --ink-0:#ffffff;--ink-1:#ffffff;--ink-2:#ffffff;--ink-3:#e4e4e7;\n        --surface-page:#ffffff;--surface-card:#ffffff;--surface-raised:#fafafa;\n        --light-0:#111318;--light-1:#2b2f36;--light-2:#4b515a;--li opskalkyl\" style=\"font-size:15px;color:var(--light-2);\">Bröllopsbudget<\u002Fa>\n        <a href=\"#guider\" style=\"font-size:15px;color:var(--light-2);\">Guider<\u002Fa>\n        <a href=\"#om\" style=\"font-size:15px;color:var(--light-2);\">Om oss<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- HERO -->\n  <div id=\"topp\" data-screen-label=\"Hero\" style=\"border-bottom:1px solid var(--border-default);\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:88px 32px 76px;\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:14px;font-family:var(--font-display);font-size:13px;letter-spacing:0.28em;text-transform:uppercase;color:var(--mint-400);margin-bottom:24px;\">\n          <span style=\"width:36px;height:1px;background:var(--mint-500);\"><\u002Fspan>Kalkylatorer för privatekonomi\n        <\u002Fdiv>\n        <h1 style=\"margin:0;font-size:56px;line-height:1.06;letter-spacing:-0.02em;font-weight:600;color:var(--light-0);text-wrap:balance;\">Räkna ut vad livets stora beslut faktiskt kostar<\u002Fh1>\n        <p style=\"margin:24px 0 0;font-size:20px;line-height:1.55;color:var(--light-2);max-width:56ch;\">Fyll i dina egna siffror och se helheten direkt — kategori för kategori, med kostnaden per gäst uträknad åt dig.<\u002Fp>\n        <div style=\"display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;\">\n          <a href=\"#brollopskalkyl\" style=\"display:inline-flex;align-items:center;gap:10px;background:var(--mint-500);color:var(--mint-ink);font-weight:600;font-size:16px;padding:14px 26px;border-radius:8px;\">Öppna bröllopsbudgeten →<\u002Fa>\n          <a href=\"#guider\" style=\"display:inline-flex;align-items:center;font-size:16px;padding:14px 24px;border:1px solid var(--border-strong);border-radius:8px;color:var(--light-1);\">Läs våra guider<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- KALKYLATORER -->\n  <div id=\"kalkylatorer\" data-screen-label=\"Kalkylatorer\" style=\"border-bottom:1px solid var(--border-default);\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:76px 32px;\">\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:32px;margin-bottom:36px;flex-wrap:wrap;\">\n        <div>\n          <div style=\"font-family:var(--font-display);font-size:13px;letter-spacing:0.28em;text-transform:uppercase;color:var(--mint-400);margin-bottom:14px;\">Våra kalkylatorer<\u002Fdiv>\n          <h2 style=\"margin:0;font-size:38px;font-weight:600;letter-spacing:-0.015em;color:var(--light-0);\">Ett verktyg för varje stort beslut<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:17px;color:var(--light-2);max-width:38ch;line-height:1.5;\">Vi bygger en kalkylator i taget och gör den ordentligt innan nästa släpps.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;\">\n        <a href=\"#brollopskalkyl\" style=\"grid-column:span 1;border:1px solid var(--mint-600);border-radius:12px;padding:30px;background:var(--surface-card);display:flex;flex-direction:column;gap:12px;min-height:180px;\">\n          <span style=\"display:inline-flex;align-self:flex-start;align-items:center;gap:8px;font-family:var(--font-display);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--mint-300);border:1px solid var(--mint-600);border-radius:999px;padding:5px 12px;\"><span style=\"width:6px;height:6px;border-radius:999px;background:var(--mint-400);\"><\u002Fspan>Live nu<\u002Fspan>\n          <h3 style=\"margin:8px 0 0;font-size:24px;font-weight:600;color:var(--light-0);\">Bröllopsbudget<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.5;color:var(--light-2);\">Nio kategorier, egna poster, kostnad per gäst och löpande jämförelse mot din budget.<\u002Fp>\n          <span style=\"margin-top:auto;font-size:15px;color:var(--mint-400);\">Öppna kalkylatorn →<\u002Fspan>\n        <\u002Fa>\n        <s  false }}\">\n        <div data-print-hide=\"true\" style=\"display:flex;align-items:center;gap:10px;font-size:15px;color:{{ importColor }};\">\n          <span style=\"width:7px;height:7px;border-radius:999px;background:{{ importColor }};flex:none;\"><\u002Fspan>{{ importMsg }}\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- INSTÄLLNINGAR -->\n      <div style=\"background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;padding:24px;display:flex;flex-wrap:wrap;gap:24px;\">\n        <div style=\"flex:1;min-width:150px;\">\n          <x-import component-from-global-scope=\"WHABDesignSystem_50185d.Input\" hint-size=\"150px,66px\" label=\"Antal gäster\" type=\"number\" min=\"0\" value=\"{{ guestCount }}\" sc-camel-on-change=\"{{ onGuestCountChange }}\"><\u002Fx-import>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:200px;\">\n          <x-import component-from-global-scope=\"WHABDesignSystem_50185d.Select\" hint-size=\"200px,66px\" label=\"Valuta\" options=\"{{ currencyOptions }}\" value=\"{{ currency }}\" sc-camel-on-change=\"{{ onCurrencyChange }}\"><\u002Fx-import>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:200px;\">\n          <x-import component-from-global-scope=\"WHABDesignSystem_50185d.Input\" hint-size=\"200px,66px\" label=\"Total budget\" type=\"number\" min=\"0\" value=\"{{ overallBudget }}\" sc-camel-on-change=\"{{ onBudgetChange }}\"><\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SUMMERING -->\n      <div style=\"background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;padding:26px;display:flex;flex-direction:column;gap:20px;\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-end;justify-content:space-between;\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:40px;\">\n            <div style=\"display:flex;flex-direction:column;gap:6px;\">\n              <span style=\"font-size:13px;letter-spacing: fault);border-right:1px solid var(--border-default);border-bottom:1px solid var(--border-default);border-radius:12px;background:var(--surface-card);overflow:hidden;\">\n\n            <div sc-camel-on-click=\"{{ section.toggle }}\" style=\"display:flex;align-items:center;gap:18px;padding:20px 24px;cursor:pointer;user-select:none;\">\n              <span style=\"width:10px;height:10px;border-radius:999px;background:{{ section.accent }};flex:none;\"><\u002Fspan>\n              <div style=\"flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;\">\n                <span style=\"font-size:19px;font-weight:600;color:var(--light-0);\">{{ section.name }}<\u002Fspan>\n                <span style=\"font-size:13px;color:var(--light-3);\">{{ section.metaLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"width:120px;height:4px;border-radius:999px;background:var(--ink-3);overflow:hidden;flex:none;\">\n                <div style=\"height:100%;width:{{ section.sharePct }}%;background:{{ section.accent }};\"><\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:var(--font-mono);font-size:21px;font-weight:600;color:{{ section.accent }};white-space:nowrap;min-width:130px;text-align:right;\">{{ section.sumFormatted }}<\u002Fspan>\n              <span style=\"width:9px;height:9px;border-right:1.5px solid var(--light-2);border-bottom:1.5px solid var(--light-2);transform:rotate({{ section.chevronDeg }}deg);transition:transform 150ms var(--ease-out);flex:none;\"><\u002Fspan>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ section.expanded }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"border-top:1px solid var(--border-subtle);padding:20px 24px;display:flex;flex-direction:column;gap:12px;\">\n                <sc-for list=\"{{ section.items }}\" as=\"item\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--border-subtle);border-radius:8px;background:var(--surface-raised);\">\n                    <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;\">\n                      <x-import component-from-global-scope=\"WHABDesignSystem_50185d.Input\" hint-size=\"180px,40px\" style=\"flex:1;min-width:160px;\" value=\"{{ item.name }}\" sc-camel-on-change=\"{{ item.onName }}\" placeholder=\"Namn på post\"><\u002Fx-import>\n                      <div style=\"display:flex;align-items:center;gap:6px;flex:none;\">\n                        <x-import component-from-global-scope=\"WHABDesignSystem_50185d.Input\" hint-size=\"100px,40px\" style=\"width:100px;\" type=\"number\" value=\"{{ item.cost }}\" sc-camel-on-change=\"{{ item.onCost }}\"><\u002Fx-import>\n                        <span style=\"font-family:var(--font-mono);font-size:13px;color:var(--light-3);\">{{ item.unitLabel }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ enablePerGuest }}\" hint-placeholder-val=\"{{ true }}\">\n                        <x-import component-from-global-scope=\"WHABDesignSystem_50185d.Switch\" hint-size=\"90px,24px\" checked=\"{{ item.perGuest }}\" sc-camel-on-change=\"{{ item.onPerGuest }}\" label=\"Per gäst\"><\u002Fx-import>\n                      <\u002Fsc-if>\n                      <x-import component-from-global-scope=\"WHABDesignSystem_50185d.Select\" hint-size=\"118px,40px\" style=\"width:150px;flex:none;\" options=\"{{ statusOptions }}\" value=\"{{ item.status }}\" sc-camel-on-change=\"{{ item.onStatus }}\"><\u002Fx-import>\n                      <x-import component-from-global-scope=\"WHABDesignSystem_50185d.Select\" hint-size=\"150px,40px\" style=\"width:150px;flex:none;\" options=\"{{ item.moveOptions }}\" value=\"__flytta__\" sc-camel-on-change=\"{{ item.onMove }}\"><\u002Fx-import>\n                      <span style=\"font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--light-0);min-width:104px;text-align:right;flex:none;\">{{ item.totalFormatted }}<\u002Fspan>\n                      <x-import component-from-global-scope=\"WHABDesignSystem_50185d.IconButton\" hint-size=\"32px,32px\" variant=\"ghost\" size=\"sm\" label=\"Ta bort post\" sc-camel-on-click=\"{{ item.onDelete }}\">×<\u002Fx-import>\n                    <\u002Fdiv>\n                    <x-import component-from-global-scope=\"WHABDesignSystem_50185d.Input\" hint-size=\"100%,40px\" style=\"width:100%;\" value=\"{{ item.comment }}\" sc-camel-on-change=\"{{ item.onComment }}\" placeholder=\"Kommentar (valfritt) — t.ex. offert, kontaktperson, deadline\"><\u002Fx-import>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <x-import component-from-global-scope=\"WHABDesignSystem_50185d.Button\" hint-size=\"auto,36px\" variant=\"ghost\" size=\"sm\" sc-camel-on-click=\"{{ section.onAdd }}\">+ Lägg till post<\u002Fx-import>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div data-print-hide=\"true\" style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;\">\n        <span style=\"font-size:14px;color:var(--light-3);\">Sparas automatiskt i den här webbläsaren. Inget skickas till någon server.<\u002Fspan>\n        <x-import component-from-global-scope=\"WHABDesignSystem_50185d.Button\" hint-size=\"auto,40px\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ onAddSection }}\">+ Ny kategori<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- GUIDER / BLOGG -->\n  <div id=\"guider\" data-screen-label=\"Guider och blogg\" style=\"border-bottom:1px solid var(--border-default);\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:76px 32px;\">\n      <div style=\"border:1px dashed var(--line-3);border-radius:12px;background:var(--ink-1);padding:56px;display:grid;grid-template-columns:1.3fr 1fr;gap:56px;align-items:center;\">\n        <div>\n          <div style=\"font-family:var(--font-display);font-size:13px;letter-spacing:0.28em;text-transform:uppercase;color:var(--light-3);margin-bottom:16px;\">Guider &amp; artiklar<\u002Fdiv>\n          <h2 style=\"margin:0 0 16px;font-size:34px;font-weight:600;letter-spacing:-0.015em;color:var(--light-0);\">Guiderna kommer snart<\u002Fh2>\n          <p style=\"margin:0;font-size:17px;line-height:1.6;color:var(--light-2);max-width:58ch;\">Vi skriver just nu de första guiderna om vad saker faktiskt kostar i Sverige — snittpriser per kategori, vad som brukar ingå i en offert och var det går att spara utan att det märks. Vi publicerar dem först när de håller.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-left:1px solid var(--line-2);padding-left:56px;display:flex;flex-direction:column;gap:16px;\">\n          <span style=\"font-size:14px;letter-spacing:0.08em;text-transform:uppercase;color:var(--light-3);\">Först ut<\u002Fspan>\n          <span style=\"font-size:19px;line-height:1.45;color:var(--light-1);\">Vad kostar ett bröllop i Sverige?<\u002Fspan>\n          <span style=\"font-size:19px;line-height:1.45;color:var(--light-1);\">Så mycket kostar en bröllopsfotograf<\u002Fspan>\n          <span style=\"font-size:19px;line-height:1.45;color:var(--light-1);\">Checklista: bokningar 12 månader före<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- OM / FOOTER -->\n  <div id=\"om\" data-screen-label=\"Om och sidfot\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:72px 32px;display:grid;grid-template-columns:1.3fr 1fr;gap:64px;align-items:start;\">\n      <div>\n        <div style=\"font-family:var(--font-display);font-size:13px;letter-spacing:0.28em;text-transform:uppercase;color:var(--mint-400);margin-bottom:16px;\">Om Privatkalkyl<\u002Fdiv>\n        <h2 style=\"margin:0 0 18px;font-size:32px;font-weight:600;color:var(--light-0);\">Praktiska verktyg utan krångel<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:1.6;color:var(--light-2);max-width:62ch;\">Privatkalkyl är byggt för dig som vill ha ordning på siffrorna innan du fattar beslutet. Vi gör svenska kalkylatorer med riktiga prisunderlag — inga översatta mallar. I dagsläget sparas dina uppgifter i din egen webbläsare.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--border-default);border-radius:12px;padding:28px;background:var(--surface-card);\">\n        <div style=\"font-size:17px;font-weight:600;color:var(--light-0);margin-bottom:8px;\">Tips på en kalkylator?<\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:15px;line-height:1.55;color:var(--light-2);\">Berätta vad du saknar så bygger vi den härnäst.<\u002Fp>\n        <a href=\"#om\" style=\"display:inline-flex;align-items:center;gap:8px;background:var(--mint-500);color:var(--mint-ink);font-weight:600;font-size:15px;padding:11px 20px;border-radius:8px;\">Hör av dig<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"integritet\" data-screen-label=\"Integritet och cookies\" style=\"border-top:1px solid var(--border-default);\">\n      <div style=\"max-width:1180px;margin:0 auto;padding:72px 32px;\">\n        <div style=\"font-family:var(--font-display);font-size:13px;letter-spacing:0.28em;text-transform:uppercase;color:var(--mint-400);margin-bottom:16px;\">Integritet &amp; cookies<\u002Fdiv>\n        <h2 style=\"margin:0 0 14px;font-size:32px;font-weight:600;color:var(--light-0);\">Var dina uppgifter tar vägen<\u002Fh2>\n        <p style=\"margin:0 0 40px;font-size:17px;line-height:1.6;color:var(--light-2);max-width:64ch;\">Kort version: vi samlar inte in något om dig, och din budget lämnar aldrig din egen enhet. Här är detaljerna.<\u002Fp>\n\n        <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:28px;\">\n          <div style=\"border:1px solid var(--border-default);border-radius:12px;background:var(--surface-card);padding:32px;\">\n            <h3 style=\"margin:0 0 12px;font-size:20px;font-weight:600;color:var(--light-0);\">Vad vi sparar om dig<\u002Fh3>\n            <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--light-2);\">Ingenting. Vi har inga konton, inga formulär och ingen databas. Vi ber dig aldrig om namn, e-post eller personuppgifter för att använda kalkylatorerna.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border-default);border-radius:12px;background:var(--surface-card);padding:32px;\">\n            <h3 style=\"margin:0 0 12px;font-size:20px;font-weight:600;color:var(--light-0);\">Var din budget lagras<\u002Fh3>\n            <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--light-2);\">Siffrorna du fyller i sparas i din webbläsares lokala lagring, på din egen enhet. De skickas aldrig till oss och vi kan inte läsa dem.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border-default);border-radius:12px;background:var(--surface-card);padding:32px;\">\n            <h3 style=\"margin:0 0 12px;font-size:20px;font-weight:600;color:var(--light-0);\">Cookies och spårning<\u002Fh3>\n            <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--light-2);\">Sajten sätter inga cookies och använder varken analysverktyg eller annonsnätverk. Vår webbvärd kan registrera tekniska uppgifter som IP-adress i sina driftloggar, vilket krävs för att kunna leverera sidan säkert.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border-default);border-radius:12px;background:var(--surface-card);padding:32px;\">\n            <h3 style=\"margin:0 0 12px;font-size:20px;font-weight:600;color:var(--light-0);\">Så tar du bort dina uppgifter<\u002Fh3>\n            <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--light-2);\">Klicka på Återställ i kalkylatorn, eller rensa webbplatsdata i din webbläsare. Då är allt borta. Vill du behålla budgeten först — exportera den till Excel.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <p style=\"margin:32px 0 0;font-size:15px;line-height:1.6;color:var(--light-3);max-width:80ch;\">Sajten är i beta och funktionerna kan komma att ändras. Om vi framöver inför konton, lagring i molnet, statistikverktyg eller annonser uppdaterar vi den här sidan innan det tas i bruk, och inhämtar samtycke där det krävs. Frågor: <a href=\"mailto:hej@privatkalkyl.se\">hej@privatkalkyl.se<\u002Fa>. Senast uppdaterad juli 2026.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border-top:1px solid var(--border-default);\">\n      <div style=\"max-width:1180px;margin:0 auto;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;\">\n        <span style=\"font-family:var(--font-display);font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:var(--light-3);\">privatkalkyl.se — en HOBL-based service<\u002Fspan>\n        <div style=\"display:flex;gap:24px;font-size:14px;\">\n          <a href=\"#integritet\" style=\"color:var(--light-3);\">Integritet &amp; cookies<\u002Fa>\n          <a href=\"mailto:hej@privatkalkyl.se\" style=\"color:var(--light-3);\">Kontakt<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;defaultCurrency&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;SEK&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;SEK&quot;,&quot;EUR&quot;,&quot;NOK&quot;,&quot;DKK&quot;,&quot;USD&quot;,&quot;GBP&quot;], &quot;section&quot;: &quot;Kalkylator&quot;},\n  &quot;budgetWarningThreshold&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 90, &quot;min&quot;: 50, &quot;max&quot;: 100, &quot;step&quot;: 5, &quot;unit&quot;: &quot;%&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Kalkylator&quot;},\n  &quot;enablePerGuestPricing&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Kalkylator&quot;}\n}\">\nconst VALUTOR = {\n  SEK: { symbol: 'kr', label: 'Svenska kronor (SEK)', after: true },\n  EUR: { symbol: '€', label: 'Euro (EUR)' },\n  NOK: { symbol: 'kr', label: 'Norska kronor (NOK)', after: true },\n  DKK: { symbol: 'kr', label: 'Danska kronor (DKK)', after: true },\n  USD: { symbol: '$', label: 'US-dollar (USD)' },\n  GBP: { symbol: '£', label: 'Brittiska pund (GBP)' },\n};\n\nconst STATUS = [\n  { value: 'uppskattning', label: 'Uppskattning' },\n  { value: 'offert', label: 'Offert' },\n  { value: 'faktisk', label: 'Faktisk' },\n];\n\nfunction belopp(n, cur) {\n  const r = Math.round(n || 0);\n  const num = Math.abs(r).toLocaleString('sv-SE');\n  const sign = r < 0 ? '−' : '';\n  return cur.after ? sign + num + ' ' + cur.symbol : sign + cur.symbol + num;\n}\n\nfunction seed() {\n  return [\n    { id: 's1', name: 'Lokal & mat', accent: 'oklch(76% 0.11 165)', collapsed: false, items: [\n      { id: 'i1', name: 'Lokalhyra', cost: 15000, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i2', name: 'Mat och servering', cost: 550, status: 'uppskattning', perGuest: true, comment: '' },\n      { id: 'i3', name: 'Dryck och bar', cost: 250, status: 'uppskattning', perGuest: true, comment: '' },\n      { id: 'i4', name: 'Bröllopstårta', cost: 3500, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i5', name: 'Bord, stolar och dukar', cost: 5000, status: 'uppskattning', perGuest: false, comment: '' },\n    ]},\n    { id: 's2', name: 'Kläder & skönhet', accent: 'oklch(76% 0.11 320)', collapsed: true, items: [\n      { id: 'i6', name: 'Brudklänning', cost: 10000, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i7', name: 'Kostym', cost: 5000, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i8', name: 'Ändringar och sömnad', cost: 2500, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i9', name: 'Hår och makeup', cost: 4000, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i10', name: 'Skor och accessoarer', cost: 2000, status: 'uppskattning', perGuest: false, comment: '' },\n    ]},\n    { id: 's3', name: 'Foto & film', accent: 'oklch(76% 0.11 195)', collapsed: true, items: [\n      { id: 'i11', name: 'Fotograf', cost: 18000, status: 'offert', perGuest: false, comment: '' },\n      { id: 'i12', name: 'Videograf', cost: 12000, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i13', name: 'Fotobås', cost: 4000, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i14', name: 'Album och kopior', cost: 3000, status: 'uppskattning', perGuest: false, comment: '' },\n    ]},\n    { id: 's4', name: 'Musik & underhållning', accent: 'oklch(76% 0.11 250)', collapsed: true, items: [\n      { id: 'i15', name: 'DJ eller liveband', cost: 12000, status: 'offert', perGuest: false, comment: '' },\n      { id: 'i16', name: 'Musiker till vigseln', cost: 3500, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i17', name: 'Ljud och ljus', cost: 4000, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i18', name: 'Toastmaster', cost: 2500, status: 'uppskattning', perGuest: false, comment: '' },\n    ]},\n    { id: 's5', name: 'Blommor & dekor', accent: 'oklch(76% 0.11 285)', collapsed: true, items: [\n      { id: 'i19', name: 'Brudbukett', cost: 2000, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i20', name: 'Dekor till vigseln', cost: 4000, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i21', name: 'Bordsdekorationer', cost: 120, status: 'uppskattning', perGuest: true, comment: '' },\n      { id: 'i22', name: 'Ljus och detaljer', cost: 2000, status: 'uppskattning', perGuest: false, comment: '' },\n    ]},\n    { id: 's6', name: 'Trycksaker', accent: 'oklch(76% 0.11 35)', collapsed: true, items: [\n      { id: 'i23', name: 'Save the date', cost: 1000, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i24', name: 'Inbjudningskort', cost: 2500, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i25', name: 'Skyltar och menyer', cost: 1500, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i26', name: 'Tackkort', cost: 1000, status: 'uppskattning', perGuest: false, comment: '' },\n    ]},\n    { id: 's7', name: 'Ringar', accent: 'oklch(76% 0.11 350)', collapsed: true, items: [\n      { id: 'i27', name: 'Förlovningsring', cost: 12000, status: 'faktisk', perGuest: false, comment: '' },\n      { id: 'i28', name: 'Vigselringar', cost: 8000, status: 'uppskattning', perGuest: false, comment: '' },\n    ]},\n    { id: 's8', name: 'Presenter & gåvor', accent: 'oklch(76% 0.11 130)', collapsed: true, items: [\n      { id: 'i29', name: 'Present till tärnor och marskalkar', cost: 2500, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i30', name: 'Present till föräldrar', cost: 1500, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i31', name: 'Gästgåvor', cost: 40, status: 'uppskattning', perGuest: true, comment: '' },\n    ]},\n    { id: 's9', name: 'Transport', accent: 'oklch(76% 0.11 100)', collapsed: true, items: [\n      { id: 'i32', name: 'Bröllopsbil', cost: 3000, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i33', name: 'Buss för gäster', cost: 4000, status: 'uppskattning', perGuest: false, comment: '' },\n      { id: 'i34', name: 'Övernattning brudpar', cost: 2500, status: 'uppskattning', perGuest: false, comment: '' },\n    ]},\n  ];\n}\n\nconst NYCKEL = 'privatkalkyl_brollop_v1';\n\nfunction tolkTal(v) {\n  const t = String(v == null ? '' : v).replace(/[\\s\\u00a0]/g, '').replace(',', '.').replace(/[^0-9.\\-]/g, '');\n  const n = parseFloat(t);\n  return isNaN(n) ? 0 : n;\n}\n\nfunction parseCsv(text) {\n  const rader = [];\n  let rad = [];\n  let falt = '';\n  let iCitat = false;\n  for (let i = 0; i < text.length; i++) {\n    const c = text[i];\n    if (iCitat) {\n      if (c === '\"') {\n        if (text[i + 1] === '\"') { falt += '\"'; i++; }\n        else iCitat = false;\n      } else falt += c;\n    } else if (c === '\"') iCitat = true;\n    else if (c === ';') { rad.push(falt); falt = ''; }\n    else if (c === '\\n') { rad.push(falt); rader.push(rad); rad = []; falt = ''; }\n    else if (c !== '\\r') falt += c;\n  }\n  if (falt !== '' || rad.length) { rad.push(falt); rader.push(rad); }\n  return rader;\n}\n\nconst KOMMANDE = [\n  { title: 'Bolånekalkyl', desc: 'Månadskostnad, amorteringskrav och vad en räntehöjning faktiskt gör med din ekonomi.' },\n  { title: 'Bilkalkyl', desc: 'Vad bilen kostar per månad och mil — värdeminskning, försäkring, skatt och drivmedel.' },\n  { title: 'Hushållsbudget', desc: 'Inkomster och utgifter månad för månad. Se vart pengarna tar vägen och vad som blir över.' },\n  { title: 'Evenemangskalkyl', desc: 'Planera festen, konferensen eller föreningsträffen. Kostnad per deltagare, lokal, mat och teknik i en och samma budget.' },\n  { title: 'Starta eget-kalkyl', desc: 'Startkostnader, löpande utgifter och hur mycket du behöver fakturera för att gå runt.' },\n];\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.nextId = 1000;\n    this.state = {\n      guestCount: 100,\n      currency: props.defaultCurrency || 'SEK',\n      overallBudget: 300000,\n      sections: seed(),\n    };\n  }\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(NYCKEL);\n      if (raw) {\n        const d = JSON.parse(raw);\n        if (d && d.sections) {\n          this.nextId = d.nextId || 1000;\n          this.setState({\n            guestCount: d.guestCount ?? this.state.guestCount,\n            currency: d.currency ?? this.state.currency,\n            overallBudget: d.overallBudget ?? this.state.overallBudget,\n            sections: d.sections,\n          });\n        }\n      }\n    } catch (e) {}\n  }\n\n  componentDidUpdate() {\n    try { localStorage.setItem(NYCKEL, JSON.stringify({ ...this.state, nextId: this.nextId })); } catch (e) {}\n  }\n\n  nyttId(p) { this.nextId += 1; return (p || 'i') + this.nextId; }\n\n  uppdatera(secId, itemId, patch) {\n    this.setState((s) => ({ sections: s.sections.map((sec) => sec.id !== secId ? sec : { ...sec, items: sec.items.map((it) => it.id !== itemId ? it : { ...it, ...patch }) }) }));\n  }\n\n  laggTill(secId) {\n    this.setState((s) => ({ sections: s.sections.map((sec) => sec.id !== secId ? sec : { ...sec, items: [...sec.items, { id: this.nyttId(), name: 'Ny post', cost: 0, status: 'uppskattning', perGuest: false, comment: '' }] }) }));\n  }\n\n  taBort(secId, itemId) {\n    this.setState((s) => ({ sections: s.sections.map((sec) => sec.id !== secId ? sec : { ...sec, items: sec.items.filter((it) => it.id !== itemId) }) }));\n  }\n\n  flytta(franId, itemId, tillId) {\n    if (franId === tillId) return;\n    this.setState((s) => {\n      let flyttad = null;\n      const utan = s.sections.map((sec) => {\n        if (sec.id !== franId) return sec;\n        flyttad = sec.items.find((it) => it.id === itemId) || null;\n        return { ...sec, items: sec.items.filter((it) => it.id !== itemId) };\n      });\n      if (!flyttad) return null;\n      return { sections: utan.map((sec) => sec.id === tillId ? { ...sec, items: [...sec.items, flyttad], collapsed: false } : sec) };\n    });\n  }\n\n  vaxla(secId) {\n    this.setState((s) => ({ sections: s.sections.map((sec) => sec.id !== secId ? sec : { ...sec, collapsed: !sec.collapsed }) }));\n  }\n\n  vaxlaAlla() {\n    this.setState((s) => {\n      const nagonOppen = s.sections.some((sec) => !sec.collapsed);\n      return { sections: s.sections.map((sec) => ({ ...sec, collapsed: nagonOppen })) };\n    });\n  }\n\n  nyKategori() {\n    const paletten = ['oklch(76% 0.11 165)','oklch(76% 0.11 320)','oklch(76% 0.11 195)','oklch(76% 0.11 250)','oklch(76% 0.11 285)','oklch(76% 0.11 35)','oklch(76% 0.11 350)','oklch(76% 0.11 130)','oklch(76% 0.11 100)','oklch(76% 0.11 60)','oklch(76% 0.11 220)'];\n    this.setState((s) => ({ sections: [...s.sections, { id: this.nyttId('s'), name: 'Ny kategori', accent: paletten[s.sections.length % paletten.length], collapsed: false, items: [] }] }));\n  }\n\n  skrivUt() {\n    this.setState(\n      (s) => ({ sections: s.sections.map((sec) => ({ ...sec, collapsed: false })) }),\n      () => setTimeout(() => window.print(), 120)\n    );\n  }\n\n  exportera() {\n    const s = this.state;\n    const cur = VALUTOR[s.currency] || VALUTOR.SEK;\n    const g = s.guestCount ?? 0;\n    const statusText = (v) => (STATUS.find((x) => x.value === v) || {}).label || v;\n    const cell = (v) => {\n      const t = String(v == null ? '' : v);\n      return /[\";\\n]/.test(t) ? '\"' + t.replace(/\"/g, '\"\"') + '\"' : t;\n    };\n    const rader = [\n      ['Privatkalkyl.se — Bröllopsbudget'],\n      ['Antal gäster', g],\n      ['Valuta', s.currency],\n      ['Total budget', s.overallBudget ?? 0],\n      [],\n      ['Kategori', 'Post', 'Pris', 'Prissätts per gäst', 'Summa', 'Status', 'Kommentar'],\n    ];\n    let total = 0;\n    (s.sections || []).forEach((sec) => {\n      sec.items.forEach((it) => {\n        const sum = it.perGuest ? (it.cost || 0) * g : it.cost || 0;\n        total += sum;\n        rader.push([sec.name, it.name, it.cost || 0, it.perGuest ? 'Ja' : 'Nej', sum, statusText(it.status), it.comment || '']);\n      });\n      const secSum = sec.items.reduce((a, it) => a + (it.perGuest ? (it.cost || 0) * g : it.cost || 0), 0);\n      rader.push(['', 'Summa ' + sec.name, '', '', secSum, '', '']);\n      rader.push([]);\n    });\n    rader.push(['', 'TOTALT', '', '', total, '', '']);\n    rader.push(['', 'Per gäst', '', '', g > 0 ? Math.round(total / g) : 0, '', '']);\n    rader.push(['', 'Kvar av budget', '', '', (s.overallBudget ?? 0) - total, '', '']);\n\n    const csv = '\\uFEFF' + rader.map((r) => r.map(cell).join(';')).join('\\r\\n');\n    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = 'brollopsbudget-privatkalkyl.csv';\n    document.body.appendChild(a);\n    a.click();\n    document.body.removeChild(a);\n    setTimeout(() => URL.revokeObjectURL(url), 2000);\n  }\n\n  importera() {\n    const input = document.createElement('input');\n    input.type = 'file';\n    input.accept = '.csv,text/csv';\n    input.style.display = 'none';\n    input.onchange = () => {\n      const fil = input.files && input.files[0];\n      if (!fil) return;\n      const lasare = new FileReader();\n      lasare.onload = () => {\n        try { this.laddaCsv(String(lasare.result || '')); }\n        catch (e) { this.setState({ importMsg: 'Filen kunde inte läsas. Använd en fil som exporterats härifrån.', importOk: false }); }\n        document.body.removeChild(input);\n      };\n      lasare.readAsText(fil, 'UTF-8');\n    };\n    document.body.appendChild(input);\n    input.click();\n  }\n\n  laddaCsv(text) {\n    const rader = parseCsv(text.replace(/^\\uFEFF/, ''));\n    const huvudIdx = rader.findIndex((r) => (r[0] || '').trim().toLowerCase() === 'kategori');\n    if (huvudIdx === -1) {\n      this.setState({ importMsg: 'Hittade ingen kategori-kolumn i filen. Använd en fil som exporterats härifrån.', importOk: false });\n      return;\n    }\n\n    const meta = {};\n    rader.slice(0, huvudIdx).forEach((r) => {\n      const nyckel = (r[0] || '').trim().toLowerCase();\n      if (nyckel) meta[nyckel] = (r[1] || '').trim();\n    });\n\n    const paletten = ['oklch(76% 0.11 165)','oklch(76% 0.11 320)','oklch(76% 0.11 195)','oklch(76% 0.11 250)','oklch(76% 0.11 285)','oklch(76% 0.11 35)','oklch(76% 0.11 350)','oklch(76% 0.11 130)','oklch(76% 0.11 100)','oklch(76% 0.11 60)','oklch(76% 0.11 220)'];\n    const ordning = [];\n    const karta = {};\n    let raknare = 2000;\n\n    rader.slice(huvudIdx + 1).forEach((r) => {\n      const kategori = (r[0] || '').trim();\n      const namn = (r[1] || '').trim();\n      if (!kategori || !namn) return;\n      if (/^summa\\b/i.test(namn) || /^totalt$/i.test(namn)) return;\n      if (!karta[kategori]) {\n        karta[kategori] = { id: 's' + ++raknare, name: kategori, accent: paletten[ordning.length % paletten.length], collapsed: ordning.length > 0, items: [] };\n        ordning.push(kategori);\n      }\n      const etikett = (r[5] || '').trim().toLowerCase();\n      const status = (STATUS.find((x) => x.label.toLowerCase() === etikett) || {}).value || 'uppskattning';\n      karta[kategori].items.push({\n        id: 'i' + ++raknare,\n        name: namn,\n        cost: tolkTal(r[2]),\n        status,\n        perGuest: /^ja$/i.test((r[3] || '').trim()),\n        comment: (r[6] || '').trim(),\n      });\n    });\n\n    if (!ordning.length) {\n      this.setState({ importMsg: 'Filen innehöll inga poster att importera.', importOk: false });\n      return;\n    }\n\n    const sections = ordning.map((k) => karta[k]);\n    const antalPoster = sections.reduce((a, s) => a + s.items.length, 0);\n    this.nextId = raknare;\n    this.setState({\n      sections,\n      guestCount: meta['antal gäster'] ? tolkTal(meta['antal gäster']) : this.state.guestCount,\n      overallBudget: meta['total budget'] ? tolkTal(meta['total budget']) : this.state.overallBudget,\n      currency: VALUTOR[(meta['valuta'] || '').toUpperCase()] ? meta['valuta'].toUpperCase() : this.state.currency,\n      importMsg: 'Importerade ' + antalPoster + ' poster i ' + sections.length + ' kategorier.',\n      importOk: true,\n    });\n  }\n\n  aterstall() {\n    this.nextId = 1000;\n    this.setState({ guestCount: 100, currency: this.props.defaultCurrency || 'SEK', overallBudget: 300000, sections: seed() });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const guestCount = s.guestCount ?? 0;\n    const cur = VALUTOR[s.currency] || VALUTOR.SEK;\n    const budget = s.overallBudget ?? 0;\n    const enablePerGuest = this.props.enablePerGuestPricing !== false;\n    const trosk = this.props.budgetWarningThreshold ?? 90;\n    const f = (n) => belopp(n, cur);\n\n    let total = 0;\n    const medSumma = (s.sections || []).map((sec) => {\n      const items = sec.items.map((it) => ({ ...it, total: it.perGuest ? (it.cost || 0) * guestCount : (it.cost || 0) }));\n      const sum = items.reduce((a, b) => a + b.total, 0);\n      total += sum;\n      return { ...sec, items, sum };\n    });\n\n    const sections = medSumma.map((sec) => {\n      const mal = medSumma.filter((x) => x.id !== sec.id).map((x) => ({ value: x.id, label: x.name }));\n      const perGuestCount = sec.items.filter((i) => i.perGuest).length;\n      const andel = total > 0 ? (sec.sum / total) * 100 : 0;\n      const items = sec.items.map((it) => ({\n        id: it.id, name: it.name, cost: it.cost, status: it.status, comment: it.comment, perGuest: it.perGuest,\n        unitLabel: it.perGuest ? cur.symbol + '/gäst' : cur.symbol,\n        totalFormatted: f(it.total),\n        moveOptions: [{ value: '__flytta__', label: 'Flytta till…' }, ...mal],\n        onName: (e) => this.uppdatera(sec.id, it.id, { name: e.target.value }),\n        onCost: (e) => this.uppdatera(sec.id, it.id, { cost: parseFloat(e.target.value) || 0 }),\n        onStatus: (e) => this.uppdatera(sec.id, it.id, { status: e.target.value }),\n        onComment: (e) => this.uppdatera(sec.id, it.id, { comment: e.target.value }),\n        onPerGuest: (e) => this.uppdatera(sec.id, it.id, { perGuest: e.target.checked }),\n        onMove: (e) => { const v = e.target.value; if (v && v !== '__flytta__') this.flytta(sec.id, it.id, v); },\n        onDelete: () => this.taBort(sec.id, it.id),\n      }));\n      const antal = items.length + (items.length === 1 ? ' post' : ' poster');\n      return {\n        id: sec.id, name: sec.name, accent: sec.accent,\n        expanded: !sec.collapsed,\n        chevronDeg: sec.collapsed ? -45 : 45,\n        metaLabel: perGuestCount > 0 ? antal + ' · ' + perGuestCount + ' per gäst · ' + Math.round(andel) + '% av totalen' : antal + ' · ' + Math.round(andel) + '% av totalen',\n        sharePct: Math.max(0, Math.min(100, andel)),\n        sumFormatted: f(sec.sum),\n        items,\n        toggle: () => this.vaxla(sec.id),\n        onAdd: () => this.laggTill(sec.id),\n      };\n    });\n\n    const pct = budget > 0 ? (total / budget) * 100 : 0;\n    const over = budget > 0 && total > budget;\n    const varning = pct >= trosk;\n    const kvar = budget - total;\n\n    return {\n      guestCount,\n      currency: s.currency,\n      overallBudget: budget,\n      enablePerGuest,\n      statusOptions: STATUS,\n      currencyOptions: Object.keys(VALUTOR).map((k) => ({ value: k, label: VALUTOR[k].label })),\n      grandTotalFormatted: f(total),\n      perGuestFormatted: guestCount > 0 ? f(total / guestCount) : f(0),\n      overallBudgetFormatted: f(budget),\n      remainingLabel: kvar >= 0 ? f(kvar) + ' kvar' : f(Math.abs(kvar)) + ' över budget',\n      remainingColor: over ? 'var(--status-danger)' : varning ? 'var(--status-warning)' : 'var(--mint-400)',\n      progressColor: over ? 'var(--status-danger)' : varning ? 'var(--status-warning)' : 'var(--mint-500)',\n      progressPct: Math.max(0, Math.min(100, pct)),\n      pctLabel: Math.round(pct) + ' %',\n      toggleAllLabel: sections.some((x) => x.expanded) ? 'Fäll ihop alla' : 'Fäll ut alla',\n      sections,\n      comingSoon: KOMMANDE,\n      onGuestCountChange: (e) => { const v = parseInt(e.target.value, 10); this.setState({ guestCount: isNaN(v) ? 0 : v }); },\n      onCurrencyChange: (e) => this.setState({ currency: e.target.value }),\n      onBudgetChange: (e) => { const v = parseFloat(e.target.value); this.setState({ overallBudget: isNaN(v) ? 0 : v }); },\n      onToggleAll: () => this.vaxlaAlla(),\n      onPrint: () => this.skrivUt(),\n      onExport: () => this.exportera(),\n      onImport: () => this.importera(),\n      importMsg: s.importMsg || '',\n      hasImportMsg: !!s.importMsg,\n      importColor: s.importOk ? 'var(--mint-400)' : 'var(--status-danger)',\n      onReset: () => this.aterstall(),\n      onAddSection: () => this.nyKategori(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
